<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventurer Life Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Panel Status Karakter -->
        <div class="panel">
            <h2>Status Karakter</h2>
            <p><strong>Nama:</strong> <span id="val-name">Arthur</span></p>
            <p><strong>Umur:</strong> <span id="val-age">15</span> Tahun (<span id="val-day">Hari 1</span>, Tahun <span id="val-year">1</span>)</p>
            <hr>
            <p><strong>STR:</strong> <span id="val-str">10</span> | <strong>AGI:</strong> <span id="val-agi">10</span> | <strong>INT:</strong> <span id="val-int">10</span></p>
            <p><strong>Gold:</strong> <span id="val-gold">50</span> G | <strong>Status:</strong> <span id="val-status">Solo Adventurer</span></p>
            <p><strong>Guild:</strong> <span id="val-guild">Belum Terdaftar</span></p>
            <p><strong>Party:</strong> <span id="val-party">Sendiri (Solo)</span></p>
        </div>

        <!-- Panel Log / Cerita Game -->
        <div class="panel log-panel">
            <h2>Kronik Kehidupan</h2>
            <div id="event-log"></div>
        </div>

        <!-- Panel Kontrol / Aksi -->
        <div class="panel control-panel">
    <h2>Kontrol Simulasi</h2>
    <button id="btn-toggle-auto" onclick="GameEngine.toggleAuto()" style="background:#ffcc00; font-size:16px; padding:12px 20px;">Mulai Auto-Progress</button>
    <button id="btn-next" onclick="GameEngine.nextTurn()">Next 1 Hari (Manual)</button>
    <div id="choice-container"></div>
        </div>
    </div>

    <!-- Panggil Engine Utama -->
    <script src="engine.js"></script>

    <!-- Panggil Semua File Event (Bisa ditambah sebanyak-banyaknya di sini) -->
    <script src="events/event_forest.js"></script>
    <script src="events/event_tavern.js"></script>
    <script src="events/event_guild.js"></script>
    <script src="events/event_starter.js"></script>

    <!-- Inisialisasi Game setelah semua script dimuat -->
    <script>
        window.onload = function() {
            GameEngine.init();
        };
    </script>
</body>
</html>
