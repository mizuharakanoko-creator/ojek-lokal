<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Manhwa Style Idle RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="panel">
        <h2>Sistem Tower (Ala Pick Me Up)</h2>
        <p>Gold: <span id="stat-gold">0</span></p>
        <button id="btn-gacha">Summon Karakter</button>
    </div>

    <!-- Panggil sistem dengan tipe module -->
    <script type="module">
        import { GameCore } from './js/core.js';
        import { GachaSystem } from './js/updates/gacha.js';

        // Jalankan Core saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            GameCore.init();

            // Hubungkan tombol HTML ke modul update tanpa merusak core
            document.getElementById('btn-gacha').addEventListener('click', () => {
                GachaSystem.pullCharacter();
            });
        });
    </script>
</body>
</html>
