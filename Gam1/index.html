<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Style Tower Idle RPG - Modular Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="panel">
        <h2>📊 Status Sistem</h2>
        <div class="stats-row">
            <span>Gold: <strong id="stat-gold">0</strong></span>
            <span>Gems: <strong id="stat-gems">50</strong></span>
            <span>Lantai Tower: <strong id="stat-floor">1</strong></span>
        </div>
        <div class="stats-row" style="margin-top: 5px; font-size: 12px; color: #94a3b8;">
            <span>Kesulitan Lantai: <strong id="stat-difficulty" style="color: #f87171;">100%</strong></span>
            <span>Risiko Bahaya: <strong id="stat-risk" style="color: #f87171;">5%</strong></span>
        </div>
    </div>

    <div class="panel">
        <h2>🗼 Eksplorasi Tower Otomatis</h2>
        <div class="progress-container">
            <div id="tower-progress-bar" class="progress-bar"></div>
            <div id="tower-progress-text" class="progress-text">0%</div>
        </div>
        <div id="tower-logs" class="log-box">
            <div>Sistem menara diaktifkan. Hati-hati, kematian hero bersifat permanen!</div>
        </div>
    </div>

    <div class="panel">
        <h2>👥 Manajemen Party & Summon</h2>
        <button id="btn-summon">Summon Pahlawan Baru (Cost: 25 Gems)</button>
        <h3 style="margin-top: 10px;">Daftar Hero Aktif:</h3>
        <div id="party-list" class="party-grid">
            <small>Belum ada pahlawan di party. Lakukan Summon!</small>
        </div>
    </div>
</div>

<!-- INISIALISASI MODUL -->
<script type="module">
    import { GameCore } from './js/core.js';
    import { PartySystem } from './js/updates/party.js';
    import { TowerSystem } from './js/updates/tower.js';

    window.addEventListener('DOMContentLoaded', () => {
        PartySystem.init();
        TowerSystem.init();
        GameCore.init();
        
        document.getElementById('btn-summon').addEventListener('click', () => {
            PartySystem.summonHero();
        });
    });
</script>

</body>
</html>
