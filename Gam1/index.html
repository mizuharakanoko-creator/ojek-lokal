<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Style Tower Idle RPG - Modular Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- PANEL STATUS GLOBAL -->
    <div class="panel">
        <h2>📊 Status Sistem</h2>
        <div class="stats-row">
            <span>Gold: <strong id="stat-gold">0</strong></span>
            <span>Gems: <strong id="stat-gems">50</strong></span>
        </div>
    </div>

    <!-- PANEL EKSPEDISI MANUAL (Menggantikan Tower Otomatis) -->
    <div class="panel">
        <h2>🗼 Manajemen Ekspedisi Lantai Tower</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 0;">Pilih lantai dan tugaskan hero yang memenuhi syarat untuk berpatroli:</p>
        <div id="expedition-container">
            <!-- Diisi otomatis oleh expedition.js -->
        </div>
    </div>

    <!-- PANEL PENINGKATAN / UPGRADE -->
    <div class="panel">
        <h2>⚡ Pelatihan Karakter (Training)</h2>
        <button id="btn-upgrade">Latih Party (+ATK & DEF) - Cost: <span id="upgrade-cost-text">50</span> Gold</button>
    </div>

    <!-- PANEL PARTY & SUMMON -->
    <div class="panel">
        <h2>👥 Manajemen Party & Summon</h2>
        <button id="btn-summon">Summon Pahlawan Baru (Cost: 25 Gems)</button>
        <h3 style="margin-top: 10px;">Daftar Hero Aktif:</h3>
        <div id="party-list" class="party-grid">
            <small>Belum ada pahlawan di party. Lakukan Summon!</small>
        </div>
    </div>
</div>

<!-- INISIALISASI MODUL TERPISAH -->
<script type="module">
    import { GameCore } from './js/core.js';
    import { PartySystem } from './js/updates/party.js';
    import { ExpeditionSystem } from './js/updates/expedition.js';
    import { UpgradeSystem } from './js/updates/upgrade.js';

    window.addEventListener('DOMContentLoaded', () => {
        // Inisialisasi semua modul sistem
        PartySystem.init();
        ExpeditionSystem.init();
        UpgradeSystem.init();
        GameCore.init();
        
        // Event listener tombol utama
        document.getElementById('btn-summon').addEventListener('click', () => {
            PartySystem.summonHero();
        });

        document.getElementById('btn-upgrade').addEventListener('click', () => {
            UpgradeSystem.upgradePartyPower();
        });
    });
</script>

</body>
</html>
