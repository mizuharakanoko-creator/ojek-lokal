<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Style Tower Idle RPG</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f19; color: #f8fafc; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }
        .panel { background: #131b2e; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; }
        h2, h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 16px; }
        .stats-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        button { background: #38bdf8; color: #0b0f19; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.9; }
        
        /* Progress Bar Tower */
        .progress-container { background: #1e293b; border-radius: 4px; overflow: hidden; height: 16px; margin-bottom: 8px; position: relative; }
        .progress-bar { background: #22c55e; height: 100%; width: 0%; transition: width 0.3s linear; }
        .progress-text { position: absolute; width: 100%; text-align: center; font-size: 11px; top: 0; font-weight: bold; color: #fff; line-height: 16px; }

        /* Log & Party List */
        .log-box { background: #070a12; border: 1px solid #1e293b; height: 120px; overflow-y: auto; padding: 8px; font-family: monospace; font-size: 12px; display: flex; flex-direction: column-reverse; gap: 4px; }
        .party-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-height: 150px; overflow-y: auto; }
        .hero-card { background: #1e293b; padding: 6px; border-radius: 4px; font-size: 12px; border-left: 3px solid #38bdf8; }
        .rarity-ssr { border-left-color: #eab308; }
        .rarity-sr { border-left-color: #a855f7; }
        .rarity-r { border-left-color: #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <!-- PANEL STATUS GLOBAL -->
    <div class="panel">
        <h2>📊 Status Sistem</h2>
        <div class="stats-row">
            <span>Gold: <strong id="stat-gold">0</strong></span>
            <span>Gems: <strong id="stat-gems">50</strong></span>
            <span>Lantai Tower: <strong id="stat-floor">1</strong></span>
        </div>
    </div>

    <!-- PANEL TOWER EXPLORATION (Modul Tower) -->
    <div class="panel">
        <h2>🗼 Eksplorasi Tower Otomatis</h2>
        <div class="progress-container">
            <div id="tower-progress-bar" class="progress-bar"></div>
            <div id="tower-progress-text" class="progress-text">0%</div>
        </div>
        <div id="tower-logs" class="log-box">
            <div>Sistem menara diaktifkan. Party mulai mendaki...</div>
        </div>
    </div>

    <!-- PANEL PARTY & SUMMON (Modul Party) -->
    <div class="panel">
        <h2>👥 Manajemen Party & Summon</h2>
        <button id="btn-summon">Summon Pahlawan Baru (Cost: 25 Gems)</button>
        <h3 style="margin-top: 10px;">Daftar Hero Aktif:</h3>
        <div id="party-list" class="party-grid">
            <!-- Diisi otomatis oleh party.js -->
        </div>
    </div>
</div>

<!-- INISIALISASI SISTEM MODULE -->
<script type="module">
    import { GameCore } from './js/core.js';
    import { PartySystem } from './js/updates/party.js';
    import { TowerSystem } from './js/updates/tower.js';

    window.addEventListener('DOMContentLoaded', () => {
        // 1. Jalankan Core
        GameCore.init();

        // 2. Jalankan Modul Party & Tower secara terpisah
        PartySystem.init();
        TowerSystem.init();

        // 3. Hubungkan tombol HTML ke modul yang bersangkutan
        document.getElementById('btn-summon').addEventListener('click', () => {
            PartySystem.summonHero();
        });
    });
</script>

</body>
</html>
